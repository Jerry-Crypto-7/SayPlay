<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>hud game</title>
    <style>
      body { margin: 0; background: #222; }
      canvas { display: block; margin: 40px auto; }
    </style>
  </head>
  <body>
    <canvas id="game" width="640" height="360"></canvas>
    <p><span data-testid="play-tick" data-tick="0" data-inputs="0"></span></p>
    <script>
      // HUD jako arkáda na /play (P68I T4): `data-tick` = simulovaný tik,
      // `data-inputs` = vstupy zapsané relací. Plocha na vstup reaguje vždycky;
      // `?accepts=1` vstup i zapíše, `?frozen=1` zastaví tiky, `?grid=1` HUD
      // mřížkové hry (`Hud.tsx`) bez `data-inputs` (P68I R2). `?spacepause=1` = hra bez mezerníku (jízda, stunt):
      // mezerník otevře kartu pauzy uprostřed plochy jako `hudKey` (tiky i vstupy stojí, klik na kartu hru restartuje),
      // Esc nebo mezerník v pauze ji zavře (P68I T8).
      const params = new URLSearchParams(location.search);
      const accepts = params.get('accepts') === '1';
      const frozen = params.get('frozen') === '1';
      const spacePause = params.get('spacepause') === '1';
      let paused = false;
      let card = null;
      function setPaused(next) {
        paused = next;
        if (paused) {
          card = document.createElement('div');
          card.setAttribute('data-testid', 'play-paused');
          card.style.cssText = 'position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);width:320px;height:200px;background:#eee';
          card.addEventListener('pointerdown', (event) => { event.stopPropagation(); x = 80; tick = 0; inputs = 0; draw(); });
          document.body.appendChild(card);
        } else if (card !== null) {
          card.remove();
          card = null;
        }
      }
      const hud = document.querySelector('[data-testid=play-tick]');
      if (params.get('grid') === '1') hud.removeAttribute('data-inputs');
      const canvas = document.getElementById('game');
      const context = canvas.getContext('2d');
      let x = 80;
      let tick = 0;
      let inputs = 0;
      function draw() {
        context.fillStyle = '#3a6ea5';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = '#f2c14e';
        context.fillRect(x, 130, 100, 100);
      }
      draw();
      if (!frozen) {
        setInterval(() => {
          if (paused) return;
          tick += 1;
          hud.setAttribute('data-tick', String(tick));
        }, 16);
      }
      function move() {
        if (paused) return;
        x = (x + 120) % (canvas.width - 100);
        draw();
        if (accepts) {
          inputs += 1;
          hud.setAttribute('data-inputs', String(inputs));
        }
      }
      window.addEventListener('keydown', (event) => {
        if (spacePause && (event.code === 'Space' || event.code === 'Escape')) {
          setPaused(!paused);
          return;
        }
        if (event.code === 'Space' || event.code === 'ArrowRight') move();
      });
      canvas.addEventListener('pointerdown', move);
    </script>
  </body>
</html>
