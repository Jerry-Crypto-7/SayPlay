[project]
name = "worldsmith-env"
version = "0.1.0"
description = "Local sentence-to-panorama generation on one GPU (FLUX.2 klein 4B via diffusers)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate>=1.10",
  "diffusers>=0.36",
  "fastapi>=0.141.1",
  "numpy>=2.2",
  "pillow>=11",
  "torch==2.6.0",
  "transformers>=4.57",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
