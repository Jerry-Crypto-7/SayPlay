# Rozlišovací znak na jméno (P45E T2): `batch.prompt_for` ho připíše do zadání obrázku hned za
# jméno, aby FLUX nenakreslil sourozence z knihovny nebo věc podobného tvaru. Psaný ručně pro
# jména kola P45E (evals/play/p45d/gen-nouns.json a pilot), žádné placené API. V komentáři je,
# co v P43 viděl slepý soudce místo jména (evals/play/p43/gen3d.md).
# Klíč je jméno po `cache.normalize` – „cyclops“ a „canvas“ dávka zkrátí na „cyclop“ a „canva“.

# Zvířata a postavy
orca = "black and white killer whale, tall dorsal fin"  # P43: penguin
hippo = "huge grey hippopotamus, barrel body, wide mouth, short stubby legs"
wolf = "grey wild wolf, pointed ears, long bushy tail"
lizard = "green lizard, long tail, sprawling legs"
genie = "blue genie with a wisp tail instead of legs, rising from a lamp"  # P43: elf
spy = "secret agent in a trench coat, hat and sunglasses"  # P43: soldier
statue = "marble statue of a person standing on a stone pedestal"  # P43: man

# Ploché a drobné věci
"playing card" = "single playing card, ace of hearts"  # P43: fuel can
portrait = "framed painting of a face in a golden frame"  # P43: bust
snowboard = "board with two bindings on top, no wheels"  # P43: skateboard

# Ostatní věci
"paper ball" = "crumpled ball of white paper"  # P43: egg
ramp = "wooden skate ramp with a sloped surface"  # P43: door
orange = "orange citrus fruit with a green leaf"  # P43: volleyball
pie = "round baked pie with a lattice crust"  # P43: pizza
