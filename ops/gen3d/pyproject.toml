[project]
name = "worldsmith-gen3d"
version = "0.1.0"
description = "Local noun-to-GLB generation on one GPU through ComfyUI (TRELLIS.2)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141.1",
  "huggingface_hub>=0.34",
  "numpy>=2.5.3",
  "pyyaml>=6",
  "trimesh>=5.1.0",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
